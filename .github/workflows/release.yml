name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build release binaries
        env:
          BUILD: ${{ github.sha }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          build() {
            local goos="$1"
            local goarch="$2"
            local extension="$3"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X main.ProducerVersion=$version -X main.ProducerBuild=$BUILD" \
              -o "dist/routedoc_${version}_${goos}_${goarch}${extension}" \
              ./cmd/routedoc
          }

          build linux amd64 ""
          build linux arm64 ""
          build darwin amd64 ""
          build darwin arm64 ""
          build windows amd64 ".exe"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RouteDoctor $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
